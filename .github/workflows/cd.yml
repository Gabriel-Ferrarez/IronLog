# Entrega/Implantação Contínua (CD)
# Ao dar merge/push na main: gera o build web e publica no GitHub Pages,
# e também gera o APK Android como artefato para download.
name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # permite disparar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-pages
  cancel-in-progress: true

jobs:
  build_web:
    name: Build Web + Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Roda os testes antes de publicar: nada quebrado vai pro ar.
      - name: Testes (gate de qualidade)
        run: flutter test

      # base-href precisa apontar para /<nome-do-repo>/ no GitHub Pages.
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o GitHub Pages automaticamente na primeira execução,
          # sem precisar ligar manualmente em Settings -> Pages.
          enablement: true

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build_apk:
    name: Build APK Android (artefato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Gera a pasta android/ no CI (ambiente com boa conexão), evitando
      # versioná-la. Se já existir no repositório, o comando apenas a mantém.
      - name: Garantir plataforma Android
        run: flutter create . --platforms android --org br.com.ironlog --project-name gym_tracker

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
